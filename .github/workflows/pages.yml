name: Publish Tutorial

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install --require-hashes -r requirements-docs.txt
      - name: Check tutorial sources
        run: python tools/check-docs.py
      - name: Build documentation
        run: python -m mkdocs build --strict --clean
      - name: Check generated links and assets
        run: python tools/site_check.py site
      - name: Select GitHub Actions as the Pages source
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
              if (data.build_type !== 'workflow') {
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  ...context.repo, build_type: 'workflow'
                });
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.request('POST /repos/{owner}/{repo}/pages', {
                ...context.repo, build_type: 'workflow'
              });
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
