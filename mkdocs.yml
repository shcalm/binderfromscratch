site_name: 从零设计 Binder
site_description: 从问题、方案与实验推导教学 IPC 驱动
site_url: https://shcalm.github.io/binderfromscratch/
repo_url: https://github.com/shcalm/binderfromscratch
repo_name: shcalm/binderfromscratch
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true
theme:
  name: material
  custom_dir: tools/site_theme
  language: zh
  font: false
  palette:
    primary: teal
    accent: deep orange
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang: zh
hooks:
  - tools/site_hooks.py
extra_css:
  - assets/site.css
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - assets/math.js
  - assets/vendor/mathjax-3.2.2-tex-svg.js
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - 阅读入口: index.md
  - 预备篇 · 初稿:
      - P01 从 main.c 到 Linux 进程: chapters/p01-process.md
      - P02 从函数调用到系统调用: chapters/p02-syscalls.md
      - P03 第一个 Linux 内核模块: chapters/p03-module.md
      - P04 搭建 Linux 内核实验环境: chapters/p04-environment.md
  - 第一篇 · 同步 RPC · 初稿:
      - 01 为什么需要 Binder: chapters/01-why-binder.md
      - 02 设计第一个字符设备驱动: chapters/02-character-device.md
      - 03 实现第一个同步 RPC: chapters/03-sync-rpc.md
  - 第二篇 · 数据与事务 · 开发中:
      - 04 mmap 接收映射: chapters/04-mmap.md
      - 05 Parcel 请求: chapters/05-parcel.md
      - 06 Transaction 与双向缓冲: chapters/06-transactions.md
  - 第三篇 · 对象与服务 · 开发中:
      - 07 Node 对象身份: chapters/07-nodes.md
      - 08 Ref 与对象转交: chapters/08-references.md
      - 09 ServiceManager 服务发现 · 设计稿: chapters/09-service-manager.md
  - 第四篇 · 线程与生命周期 · 设计稿:
      - 10 线程与嵌套回调: chapters/10-thread-model.md
      - 11 文件描述符传递: chapters/11-file-descriptors.md
      - 12 引用生命周期与死亡通知: chapters/12-lifetime.md
  - 第五篇 · 安全与稳定性 · 设计稿:
      - 13 身份与授权: chapters/13-security.md
      - 14 Oneway 与背压: chapters/14-oneway.md
      - 15 并发与资源回收: chapters/15-concurrency.md
  - 第六篇 · 真实 Binder · 阅读稿:
      - 16 从需求定位内核架构: chapters/16-binder-architecture.md
      - 17 逐事件追踪一次调用: chapters/17-call-trace.md
      - 18 设计复盘与 Rust 对照: chapters/18-design-review.md
  - 实验与代码:
      - 实验入口: labs/index.md
      - QEMU 手动验证 mini-binder: labs/qemu-manual.md
      - 进程与 RPC 边界: labs/intro-boundaries.md
      - 系统调用: labs/syscalls.md
      - 请求队列模型: labs/queue-model.md
      - 接收映射模型: labs/mapping-model.md
      - Parcel 编解码模型: labs/parcel-model.md
      - 事务状态与资源模型: labs/transaction-model.md
      - Node 身份与持有模型: labs/node-model.md
      - Ref 与转换回滚模型: labs/reference-model.md
      - 代码版本索引: reference/code-versions.md
      - 源码阅读: source/index.md
  - 参考与进度:
      - 术语表: reference/glossary.md
      - Android 源码基线: reference/android-binder.md
      - AOSP 用户态基线: reference/aosp-userspace.md
      - 范围声明: design/scope.md
      - 教学规范: design/teaching-contract.md
      - 字符设备 ABI: design/device-abi.md
      - 同步 RPC 设计: design/minimal-rpc.md
      - 接收区设计: design/receive-region.md
      - Parcel 格式设计: design/parcel-format.md
      - 事务与双向缓冲设计: design/transactions.md
      - Node 对象身份设计: design/nodes.md
      - Ref 与对象转换设计: design/references.md
      - 全书路线: plans/roadmap.md
      - 任务总表: plans/task-backlog.md
      - 第一阶段计划: plans/phase-01.md
      - 阶段实测报告: reports/m0-m1-progress.md
      - 第 04 章映射实测报告: reports/m2-mapping-progress.md
      - 第 05 章 Parcel 实测报告: reports/m2-parcel-progress.md
      - 第 06 章事务实测报告: reports/m2-transactions-progress.md
      - 第 07 章 Node 实测报告: reports/m3-nodes-progress.md
      - 第 08 章 Ref 实测报告: reports/m3-references-progress.md
      - 第 09–18 章阅读稿与验证: reports/remaining-chapters-draft.md
      - 修订与勘误: reference/changes.md
      - 本地构建与预览: site-guide.md
